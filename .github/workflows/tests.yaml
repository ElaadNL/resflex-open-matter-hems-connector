name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          pip install -e ".[server,test]"

      - name: Run pre-commit
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev
          python -m pip install --upgrade pip
          pip install -e ".[server,test]"

      - name: Run pytest
        run: pytest --durations 10 --cov=matter_server --cov-report=term-missing --cov-report=xml:coverage.xml -rA tests/
